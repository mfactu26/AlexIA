name: Security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit dependencies without running package install scripts
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm audit --audit-level=high
          fi
